x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: search
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: documents

x-depends-on-storage: &depends-on-storage
  db:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: search
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Do not block the index on a nearly full laptop disk.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # The image is always built from the sources in this repository.
  app:
    image: search-service:local
    build:
      context: .
      target: runtime
    # Brings the API back if it fails on startup or crashes (e.g. while a dependency restarts).
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on: *depends-on-storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dataset import: docker compose run --rm loader [--download] [--recreate] [--reindex]
  loader:
    image: search-service:local
    build:
      context: .
      target: runtime
    profiles: ["tools"]
    # The dataset is downloaded into a bind-mounted host directory; its owner on the host is
    # unknown, so this one-off tool runs as root to be able to write there.
    user: root
    environment: *app-environment
    volumes:
      - ./data:/app/data
    depends_on: *depends-on-storage
    entrypoint: ["python", "-m", "app.loader"]
    command: ["--download"]

  # Functional tests: docker compose run --rm tests
  # They use their own database and index (search_test / documents_test).
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      <<: *app-environment
      TEST_POSTGRES_DB: search_test
      TEST_ELASTICSEARCH_INDEX: documents_test
    depends_on: *depends-on-storage

volumes:
  postgres-data:
  elasticsearch-data:
